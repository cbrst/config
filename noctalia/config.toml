[bar.main]
background_opacity = 0.24999999441206455
center = [ "clock" ]
end = [ "tray", "notifications", "clipboard", "volume", "control-center", "session" ]
margin_edge = 0
margin_ends = 0
padding = 14
panel_overlap = 0
position = "top"
radius = 8
radius_top_left = 0
radius_top_right = 0
reserve_space = true
shadow = true
start = [ "workspaces" ]
thickness = 34
widget_spacing = 18

[dock]
enabled = false
icon_size = 34
launcher_icon = "grain"
launcher_position = "start"
radius = 8
show_instance_count = false

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 600

[lockscreen]
blur_intensity = 0.55000000000000004
blurred_desktop = true
enabled = true
tint_intensity = 0.25

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.93999999999999995
enable_daemon = true
offset_x = 20
offset_y = 12

[osd]
background_opacity = 0.93999999999999995
offset_x = 20
offset_y = 12
position = "top_right"

[shell]
clipboard_enabled = true
clipboard_keep_from_closed_apps = true
corner_radius_scale = 1.25
date_format = "%A, %x"
font_family = "CommitMono"
telemetry_enabled = false
time_format = "{:%H:%M}"

    [shell.animation]
    enabled = true
    speed = 1.45

    [shell.launcher]
    categories = true
    compact = false
    show_icons = true
    sort_by_usage = true

    [shell.panel]
    borders = true
    clipboard_placement = "floating"
    clipboard_position = "center"
    control_center_placement = "floating"
    launcher_placement = "floating"
    launcher_position = "auto"
    shadow = true
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = false
    size = 12

    [shell.shadow]
    alpha = 0.47999999999999998
    direction = "down"

[theme]
builtin = "Tokyo-Night"
community_palette = "Cyberpunk"
mode = "dark"
pure_black_dark = false
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "gtk4", "ghostty", "hyprland" ]

[wallpaper]
directory = "~/Pictures/Wallpapers"
enabled = true
fill_mode = "crop"
transition = [ "fade", "zoom" ]
transition_duration = 350
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/cbrst/Pictures/Wallpapers/wallhaven-jx68rw.jpg"

    [wallpaper.last]
    path = "/home/cbrst/Pictures/Wallpapers/wallhaven-jx68rw.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/cbrst/Pictures/Wallpapers/wallhaven-jx68rw.jpg"

[widget.tray]
drawer = true
